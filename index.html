
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fextoo 💘</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff416c,#8e2de2);
  color:#333;
}

header{
  text-align:center;
  color:white;
  padding:45px 20px;
}

header h1{
  font-size:50px;
  margin:10px;
}

header p{
  font-size:19px;
}

.box{
  background:white;
  max-width:450px;
  margin:10px auto 30px;
  padding:30px 20px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 8px 25px #0004;
}

h2{
  color:#e91e63;
}

input,select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.price{
  font-size:30px;
  font-weight:bold;
  color:#e91e63;
  margin:20px;
}

button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:30px;
  background:#e91e63;
  color:white;
  font-size:18px;
  font-weight:bold;
}

footer{
  text-align:center;
  color:white;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <div style="font-size:65px;">💘</div>
  <h1>Fextoo</h1>
  <p>Meet • Connect • Find Love ❤️</p>
</header>

<div class="box">

  <h2>Welcome to Fextoo</h2>

  <p>
    Discover new people and build meaningful
    connections.
  </p>

  <h2>Join Today 💕</h2>

  <input type="text" placeholder="Full Name">

  <input type="tel" placeholder="Phone Number">

  <input type="email" placeholder="Email Address">

  <select>
    <option>Select Gender</option>
    <option>Male</option>
    <option>Female</option>
  </select>

  <select>
    <option>Looking for...</option>
    <option>Friendship</option>
    <option>Dating</option>
    <option>Relationship</option>
  </select>

  <div class="price">KES 350</div>

  <p>Registration Fee</p>

  <button onclick="alert('Thank you for choosing Fextoo! M-PESA payment will be connected next.')">
    Register Now 💘
  </button>

</div>

<footer>
  © 2026 Fextoo Connection Dating Site
</footer>

</body>
  </html>
